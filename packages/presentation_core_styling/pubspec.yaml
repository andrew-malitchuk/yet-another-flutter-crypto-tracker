name: presentation_core_styling
version: 0.0.1
publish_to: "none"

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-ExtraLight.ttf
          weight: 200
          style: normal
        - asset: assets/fonts/Manrope-Light.ttf
          weight: 300
          style: normal
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
          style: normal
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
          style: normal
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
          style: normal
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
          style: normal
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
          style: normal
